<h1 mat-dialog-title>{{ isEditMode ? 'Editar Libro' : 'Nuevo Libro' }}</h1>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-dialog-content>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Título</mat-label>
      <input matInput formControlName="title" required>
      <mat-error *ngIf="form.get('title')?.hasError('required')">
        El título es obligatorio.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Autor</mat-label>
      <input matInput formControlName="author" required>
      <mat-error *ngIf="form.get('author')?.hasError('required')">
        El autor es obligatorio.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Género</mat-label>
      <input matInput formControlName="genre" required>
      <mat-error *ngIf="form.get('genre')?.hasError('required')">
        El género es obligatorio.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Año</mat-label>
      <input matInput type="number" formControlName="year">
      <mat-error *ngIf="form.get('year')?.hasError('min')">
        El año no puede ser negativo.
      </mat-error>
    </mat-form-field>

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
      {{ isEditMode ? 'Actualizar' : 'Crear' }}
    </button>
  </mat-dialog-actions>
</form>
