<article class="auth-card" aria-labelledby="login-title">
  <header class="auth-card__header">
    <p class="auth-card__eyebrow">Bienvenido de vuelta</p>
    <h2 id="login-title">Continúa tu próxima lectura</h2>
    <p>Ingresa con tu cuenta para consultar reservas, préstamos y favoritos.</p>
  </header>
  <form class="auth-form" (ngSubmit)="login()">
    <mat-form-field appearance="outline">
      <mat-label>Nombre de usuario</mat-label>
      <input matInput [(ngModel)]="username" name="username" autocomplete="username" required [disabled]="isLoading">
      <mat-icon matSuffix>person</mat-icon>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Contraseña</mat-label>
      <input matInput [(ngModel)]="password" name="password" autocomplete="current-password" [type]="hidePassword ? 'password' : 'text'" required [disabled]="isLoading">
      <button mat-icon-button matSuffix (click)="togglePasswordVisibility($event)" type="button" [attr.aria-label]="hidePassword ? 'Mostrar contraseña' : 'Ocultar contraseña'">
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>
    <div class="auth-message auth-message--error" role="alert" *ngIf="errorMessage && !isLoading">
      <mat-icon>error_outline</mat-icon><span>{{ errorMessage }}</span>
    </div>
    <button mat-flat-button color="primary" class="auth-form__submit" type="submit" [disabled]="isLoading || !username || !password">
      <mat-icon>{{ isLoading ? 'hourglass_empty' : 'login' }}</mat-icon>
      {{ isLoading ? 'Iniciando sesión…' : 'Iniciar sesión' }}
    </button>
    <p class="auth-form__switch">¿Aún no tienes cuenta? <a mat-button color="primary" routerLink="/auth/register">Crear cuenta</a></p>
  </form>
</article>
