<h1 mat-dialog-title>{{ isEditMode ? 'Editar Préstamo' : 'Nuevo Préstamo' }}</h1>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-dialog-content>

    <mat-form-field class="full-width" appearance="outline">
      <mat-label>ID del Libro</mat-label>
      <input matInput formControlName="bookId" required>
    </mat-form-field>

    <mat-form-field class="full-width" appearance="outline">
      <mat-label>ID del Usuario</mat-label>
      <input matInput formControlName="userId" required>
    </mat-form-field>

    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Fecha de Préstamo</mat-label>
      <input matInput type="date" formControlName="loanDate" required>
    </mat-form-field>

    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Fecha de Devolución</mat-label>
      <input matInput type="date" formControlName="returnDate">
    </mat-form-field>

    <mat-slide-toggle formControlName="isReturned">
      Devuelto
    </mat-slide-toggle>

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
      {{ isEditMode ? 'Actualizar' : 'Crear' }}
    </button>
  </mat-dialog-actions>
</form>
